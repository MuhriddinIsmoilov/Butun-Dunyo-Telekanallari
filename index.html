<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StreamHub — Live TV & Radio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="background-glow"></div>

  <!-- Desktop uchun Yon Menyusi (Sidebar) -->
  <aside class="sidebar desktop-only">
    <div class="logo">
      <i class="fa-solid fa-play"></i>
      <span>StreamHub</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-item active" data-tab="tv"><i class="fa-solid fa-tv"></i> Direct TV</a>
      <a href="#" class="nav-item" data-tab="radio"><i class="fa-solid fa-radio"></i> Radio</a>
      <a href="#" class="nav-item" data-tab="explore"><i class="fa-solid fa-compass"></i> Explore</a>
      <a href="#" class="nav-item" data-tab="settings"><i class="fa-solid fa-gear"></i> Sozlamalar</a>
    </nav>
  </aside>

  <!-- Asosiy Kontent Maydoni -->
  <main class="main-content">
    <header class="top-bar">
      <div class="header-title">
        <i class="fa-solid fa-circle-dot live-icon"></i>
        <h1>Global Media Portal</h1>
      </div>
      <div class="status-badge">
        <span class="live-dot"></span> LIVE NOW
      </div>
    </header>

    <!-- To'liq Shaffof Shisha Konteyner (Famelack Link va URL paneli olib tashlangan) -->
    <div class="glass-frame">
      <iframe 
        id="mainIframe"
        src="https://famelack.com" 
        title="Famelack Media Stream" 
        allow="autoplay; camera; microphone; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </main>

  <!-- Mobil Qurilmalar uchun Pastki Menyu (Bottom Navigation) -->
  <nav class="mobile-nav mobile-only">
    <a href="#" class="mobile-nav-item active" data-tab="tv">
      <i class="fa-solid fa-tv"></i>
      <span>TV</span>
    </a>
    <a href="#" class="mobile-nav-item" data-tab="radio">
      <i class="fa-solid fa-radio"></i>
      <span>Radio</span>
    </a>
    <a href="#" class="mobile-nav-item" data-tab="explore">
      <i class="fa-solid fa-compass"></i>
      <span>Explore</span>
    </a>
    <a href="#" class="mobile-nav-item" data-tab="settings">
      <i class="fa-solid fa-gear"></i>
      <span>Sozlamalar</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
